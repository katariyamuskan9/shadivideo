<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7f7">
  <title>You're Invited</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Georgia, "Times New Roman", serif;
      color: #563d45;
      background: radial-gradient(circle at 10% 10%, #fce4e8 0, transparent 30%),
                  radial-gradient(circle at 90% 85%, #f8e5d8 0, transparent 28%), #fff9f7;
    }
    .page { min-height: 100vh; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 54px 18px 24px; }
    .invitation { width: min(820px, 100%); text-align: center; z-index: 1; }
    .eyebrow { letter-spacing: .28em; font: 11px Arial, sans-serif; color: #a36c78; }
    h1 { font-size: clamp(42px, 8vw, 76px); font-weight: 400; margin: 15px 0; color: #874e60; }
    .intro { max-width: 540px; margin: 0 auto 30px; font-size: 17px; line-height: 1.7; color: #795d63; }
    .video-frame { padding: 9px; border: 1px solid #e8c9ce; border-radius: 18px; background: #fff; box-shadow: 0 18px 55px #8b59601c; }
    video { display: block; width: 100%; max-height: 76vh; border-radius: 11px; background: #241b20; }
    .hint { font: 12px Arial, sans-serif; letter-spacing: .08em; color: #a17a80; margin-top: 13px; }
    .ornament { font-size: 35px; color: #bd8791; margin: 22px 0 5px; }
    .closing { font-size: 16px; line-height: 1.6; color: #795d63; }
    footer { margin-top: auto; padding-top: 34px; font: 11px Arial, sans-serif; letter-spacing: .12em; color: #ad8a8e; }
    .decoration { position: absolute; color: #e8c4ca; opacity: .7; pointer-events: none; }
    .one { top: 12%; left: 8%; font-size: 42px; }
    .two { right: 8%; bottom: 15%; font-size: 58px; }
    @media (max-width: 520px) { .page { padding-top: 38px; } .intro { font-size: 15px; } .video-frame { padding: 5px; border-radius: 13px; } video { border-radius: 9px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="decoration one">✦</div>
    <div class="decoration two">❀</div>
    <section class="invitation">
      <p class="eyebrow">A SPECIAL INVITATION</p>
      <h1>You're Invited</h1>
      <p class="intro">We would be delighted to have you join us for our special celebration.</p>
      <div class="video-frame">
        <video controls playsinline preload="metadata">
          <source src="video/main.mp4" type="video/mp4">
          Sorry, your browser cannot play this video.
        </video>
      </div>
      <p class="hint">Tap play to watch the invitation</p>
      <div class="ornament">❧</div>
      <p class="closing">With love, we look forward to celebrating with you.</p>
    </section>
    <footer>MADE WITH LOVE</footer>
  </main>
</body>
</html>
